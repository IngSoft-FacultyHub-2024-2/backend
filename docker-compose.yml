version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '8080:3000'
      - '9229:9229'  # Add debug port
    depends_on:
      - postgres
    environment:
      - NAME_DB=faculty_hub_db
      - USER_DB=postgres
      - PASSWORD_DB=postgres
      - HOST_DB=postgres
      - PORT_DB=5432
    volumes:
      - .:/app
      - /app/node_modules
    command: ["npm", "run", "debug"]  # Use debug script

  postgres:
    image: postgres:latest
    environment:
      POSTGRES_DB: faculty_hub_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
  # original    - '5433:5432'
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
